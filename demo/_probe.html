<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>probe</title>
</head>
<body>
<script>
var out = [];
var lost = [];
window.addEventListener("webglcontextlost", function (e) {
  lost.push(e.target.id || e.target.tagName);
  e.preventDefault();
});
document.addEventListener("DOMContentLoaded", function () {
  var c = document.createElement("canvas");
  window.__channel2d = !!c.getContext("2d");
  var active = 0, nulled = 0;
  var cs = [];
  for (var i = 0; i < 40; i++) {
    var cv = document.createElement("canvas");
    cv.id = "cv" + i;
    cv.style.cssText = "position:absolute;left:-9999px;";
    document.body.appendChild(cv);
    var gl = null;
    try { gl = cv.getContext("webgl2", { antialias: false, alpha: false, depth: false, stencil: false }); } catch (e) {}
    if (gl) active++; else nulled++;
    cs.push(gl);
    // try compiling the trivial vertex shader on each live context
    if (gl) {
      var vs = gl.createShader(gl.VERTEX_SHADER);
      gl.shaderSource(vs, "#version 300 es\nprecision highp float;\nvoid main(){ gl_Position = vec4(0.0); }");
      gl.compileShader(vs);
      if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
        out.push("ctx" + i + " vertex compile FALSE after " + (i + 1) + " contexts: " + gl.getShaderInfoLog(vs));
      }
    }
  }
  out.push("2d available: " + window.__channel2d);
  out.push("webgl2 contexts created: " + active + ", nulled: " + nulled + " (of 40)");
  out.push("context lost events: " + lost.length + " " + lost.join(","));
  var pre = document.createElement("pre");
  pre.id = "report";
  pre.textContent = out.join("\n");
  document.body.appendChild(pre);
  if (typeof dump === "function") dump(out.join("\n") + "\n");
});
</script>
</body>
</html>
